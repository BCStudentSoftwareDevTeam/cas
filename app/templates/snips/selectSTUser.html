{% set selectedUsernames = (instructors[course.stId] | map(attribute='username.username') | list) if course is defined else [] %}
<select {% if course.status == 3 %} disabled {% endif %} class="selectpicker form-control show-tick" id="professors" name="professors[]" multiple data-live-search="true">
  {# Show the already selected instructors first so they can be removed without searching #}
  {% for isSelected in [true, false] %}
  {% for user in users %}
  {% if (user.username in selectedUsernames) == isSelected %}
  <option value="{{user.username}}" 
    {% if (course is defined)  %}
      {%for instructor in instructors[course.stId] %}
        {% if instructor.username.username == user.username %}
          selected
        {% endif %}
      {% endfor %}
    {% endif %}
    data-subtext = "{{user.username}}"
  >
    {{user.firstName}} {{user.lastName}}
  </option>
  {% endif %}
  {% endfor %}
  {% endfor %}
</select>
